name: Build AltStore Repo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.json'
      - 'scripts/generator.js'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: altstore-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate source.json
        run: node scripts/generator.js

      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo/source.json repo/.last_good.json

          if git diff --cached --quiet; then
            echo '✅ Нет изменений'
            exit 0
          fi

          git commit -m '🤖 Auto-update AltStore source [skip ci]'
          git push
